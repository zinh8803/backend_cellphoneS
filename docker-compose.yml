services:
    nginx:
        image: nginx:1.27-alpine
        container_name: backend_cellphones_nginx
        depends_on:
            - app
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: backend_cellphones_app
        working_dir: /var/www
        volumes:
            - ./:/var/www
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            L5_SWAGGER_CONST_HOST: http://localhost:8080
            CORS_ALLOWED_ORIGINS: "*"

            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: backend_cellphones
            DB_USERNAME: backend
            DB_PASSWORD: backend

            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: ""
        depends_on:
            - mysql
            - redis

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: backend_cellphones_queue
        working_dir: /var/www
        volumes:
            - ./:/var/www
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            L5_SWAGGER_CONST_HOST: http://localhost:8080
            CORS_ALLOWED_ORIGINS: "*"

            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: backend_cellphones
            DB_USERNAME: backend
            DB_PASSWORD: backend

            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: ""
        depends_on:
            - mysql
            - redis
        command:
            [
                "php",
                "artisan",
                "queue:work",
                "--sleep=3",
                "--tries=3",
                "--timeout=90",
            ]

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: backend_cellphones_scheduler
        working_dir: /var/www
        volumes:
            - ./:/var/www
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            L5_SWAGGER_CONST_HOST: http://localhost:8080
            CORS_ALLOWED_ORIGINS: "*"

            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: backend_cellphones
            DB_USERNAME: backend
            DB_PASSWORD: backend

            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: ""
        depends_on:
            - mysql
            - redis
        command: ["php", "artisan", "schedule:work"]

    mysql:
        image: mysql:8.0
        container_name: backend_cellphones_mysql
        command: --default-authentication-plugin=mysql_native_password
        environment:
            MYSQL_DATABASE: backend_cellphones
            MYSQL_USER: backend
            MYSQL_PASSWORD: backend
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql

    phpmyadmin:
        image: phpmyadmin:5
        container_name: backend_cellphones_phpmyadmin
        depends_on:
            - mysql
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "8081:80"

    redis:
        image: redis:7-alpine
        container_name: backend_cellphones_redis
        ports:
            - "6380:6379"
        volumes:
            - redis_data:/data

volumes:
    mysql_data:
    redis_data:
