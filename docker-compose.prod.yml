services:
  nginx:
    image: nginx:1.27-alpine
    container_name: backend_cellphones_nginx_prod
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  app:
    image: backend-cellphones-php:prod
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: backend_cellphones_app_prod
    working_dir: /var/www
    environment:
      CONTAINER_ROLE: app
      WAIT_FOR_DB: "true"
      AUTO_MIGRATE: "true"
      AUTO_SEED: "false"
      AUTO_OPTIMIZE: "true"
      AUTO_STORAGE_LINK: "true"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      L5_SWAGGER_CONST_HOST: http://localhost:8000
      CORS_ALLOWED_ORIGINS: "*"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: backend_cellphones
      DB_USERNAME: backend
      DB_PASSWORD: backend

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  queue:
    image: backend-cellphones-php:prod
    container_name: backend_cellphones_queue_prod
    working_dir: /var/www
    environment:
      CONTAINER_ROLE: queue
      WAIT_FOR_DB: "true"
      AUTO_MIGRATE: "false"
      AUTO_SEED: "false"
      AUTO_OPTIMIZE: "false"
      AUTO_STORAGE_LINK: "false"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      L5_SWAGGER_CONST_HOST: http://localhost:8000
      CORS_ALLOWED_ORIGINS: "*"
      CORS_SUPPORTS_CREDENTIALS: "true"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: backend_cellphones
      DB_USERNAME: backend
      DB_PASSWORD: backend

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    restart: unless-stopped

  scheduler:
    image: backend-cellphones-php:prod
    container_name: backend_cellphones_scheduler_prod
    working_dir: /var/www
    environment:
      CONTAINER_ROLE: scheduler
      WAIT_FOR_DB: "true"
      AUTO_MIGRATE: "false"
      AUTO_SEED: "false"
      AUTO_OPTIMIZE: "false"
      AUTO_STORAGE_LINK: "false"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      L5_SWAGGER_CONST_HOST: http://localhost:8000
      CORS_ALLOWED_ORIGINS: "*"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: backend_cellphones
      DB_USERNAME: backend
      DB_PASSWORD: backend

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: backend_cellphones_mysql_prod
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: backend_cellphones
      MYSQL_USER: backend
      MYSQL_PASSWORD: backend
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: backend_cellphones_redis_prod
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    container_name: backend_cellphones_phpmyadmin_prod
    profiles: ["tools"]
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"

volumes:
  mysql_data:
  redis_data:
